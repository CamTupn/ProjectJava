spring.application.name=scentstation-backend

server.port=8080

server.servlet.context-path=/

# API
app.api.base-path=/api/v1

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/scentstation
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000
# MQTT Device Communication (disabled by default; enable with MQTT_ENABLED=true)
scentstation.mqtt.enabled=${MQTT_ENABLED:false}
scentstation.mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
scentstation.mqtt.client-id=${MQTT_CLIENT_ID:scentstation-backend}
scentstation.mqtt.username=${MQTT_USERNAME:}
scentstation.mqtt.password=${MQTT_PASSWORD:}
scentstation.mqtt.connection-timeout-seconds=${MQTT_CONNECTION_TIMEOUT:10}
scentstation.mqtt.keep-alive-seconds=${MQTT_KEEP_ALIVE:30}
scentstation.mqtt.qos=${MQTT_QOS:1}
scentstation.mqtt.command-retained=${MQTT_COMMAND_RETAINED:false}
scentstation.mqtt.topic-prefix=${MQTT_TOPIC_PREFIX:scentstation}
# Allowlist: expected device identity per machine. Configure each device explicitly.
scentstation.mqtt.devices.simulator-001=${MQTT_DEVICE_IDENTITY:simulator-device-001}

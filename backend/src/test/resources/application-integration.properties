spring.application.name=scentstation-backend-integration

# Integration Test Database
spring.datasource.url=jdbc:mysql://localhost:3306/scentstation_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=scentstation_tester
spring.datasource.password=${TEST_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# SQL Initialization
spring.sql.init.mode=never

# JWT Configuration
app.jwt.secret=${TEST_JWT_SECRET}
app.jwt.expiration=86400000
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1680" viewBox="0 0 2400 1680" role="img" aria-labelledby="title description">
  <title id="title">ScentStation Use Case Diagram Reference</title>
  <desc id="description">Detailed use case diagram with eight actors, seventeen use cases, system boundary, and payment include relationship.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #243247; }
      .title { font-size: 38px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #607086; }
      .boundary { fill: #fbfdff; stroke: #47678f; stroke-width: 4; }
      .group { fill: #f2f7fc; stroke: #8ca5c2; stroke-width: 2; }
      .group-title { font-size: 25px; font-weight: 700; fill: #355577; }
      .usecase { fill: #ffffff; stroke: #567da9; stroke-width: 3; }
      .uc-id { font-size: 15px; font-weight: 700; fill: #54708e; }
      .uc-label { font-size: 18px; font-weight: 600; }
      .actor-line { fill: none; stroke: #8493a5; stroke-width: 2.2; opacity: .62; }
      .include { fill: none; stroke: #ad6f35; stroke-width: 3; stroke-dasharray: 10 8; }
      .include-label { font-size: 17px; font-weight: 700; fill: #985e27; }
      .actor { stroke: #354b63; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .actor-label { font-size: 17px; font-weight: 600; text-anchor: middle; }
      .note { font-size: 17px; fill: #576a7f; }
      .legend { fill: #fffaf3; stroke: #d7b78f; stroke-width: 2; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ad6f35"/>
    </marker>
  </defs>

  <rect width="2400" height="1680" fill="#f5f7fa"/>
  <text class="title" x="1200" y="52" text-anchor="middle">ScentStation — Use Case Diagram</text>
  <text class="subtitle" x="1200" y="82" text-anchor="middle">TASK-003 reference • 8 actors • 17 use cases • Recreate/edit as use-case-diagram.drawio</text>

  <rect class="boundary" x="480" y="110" width="1440" height="1490" rx="16"/>
  <text x="1200" y="150" text-anchor="middle" font-size="27" font-weight="700">ScentStation System</text>

  <rect class="group" x="510" y="175" width="1380" height="470" rx="14"/>
  <text class="group-title" x="545" y="215">Kiosk — Customer Journey</text>
  <rect class="group" x="510" y="675" width="1380" height="890" rx="14"/>
  <text class="group-title" x="545" y="715">Admin Portal — Brand &amp; Operations</text>

  <!-- Actor associations are drawn behind the use cases. -->
  <g class="actor-line">
    <!-- Customer -->
    <path d="M300 255 C410 255 475 270 650 270"/>
    <path d="M300 255 C430 255 470 365 650 365"/>
    <path d="M300 255 C430 255 470 460 650 460"/>
    <path d="M300 255 C430 255 470 555 650 555"/>
    <path d="M300 255 C760 255 930 410 1240 410"/>
    <path d="M300 255 C760 255 930 520 1240 520"/>

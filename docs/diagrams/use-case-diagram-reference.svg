  <!-- UML include relationship: making payment includes verifying payment. -->
  <path class="include" d="M1030 555 C1120 555 1180 345 1240 310" marker-end="url(#arrow)"/>
  <rect x="1035" y="420" width="128" height="32" rx="6" fill="#fffaf3"/>
  <text class="include-label" x="1099" y="443" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <!-- Actors -->
  <g class="actor">
    <circle cx="220" cy="220" r="20"/>
    <path d="M220 240 L220 291 M190 260 L250 260 M220 291 L193 328 M220 291 L247 328"/>
    <circle cx="220" cy="740" r="20"/>
    <path d="M220 760 L220 811 M190 780 L250 780 M220 811 L193 848 M220 811 L247 848"/>
    <circle cx="220" cy="915" r="20"/>
    <path d="M220 935 L220 986 M190 955 L250 955 M220 986 L193 1023 M220 986 L247 1023"/>
    <circle cx="220" cy="1090" r="20"/>
    <path d="M220 1110 L220 1161 M190 1130 L250 1130 M220 1161 L193 1198 M220 1161 L247 1198"/>
    <circle cx="220" cy="1265" r="20"/>
    <path d="M220 1285 L220 1336 M190 1305 L250 1305 M220 1336 L193 1373 M220 1336 L247 1373"/>
    <circle cx="220" cy="1440" r="20"/>
    <path d="M220 1460 L220 1511 M190 1480 L250 1480 M220 1511 L193 1548 M220 1511 L247 1548"/>
    <circle cx="2180" cy="225" r="20"/>
    <path d="M2180 245 L2180 296 M2150 265 L2210 265 M2180 296 L2153 333 M2180 296 L2207 333"/>
    <circle cx="2180" cy="445" r="20"/>
    <path d="M2180 465 L2180 516 M2150 485 L2210 485 M2180 516 L2153 553 M2180 516 L2207 553"/>

  <g class="actor-label">
    <text x="220" y="352">Customer / Kiosk User</text>
    <text x="220" y="872">Platform Super Admin</text>
    <text x="220" y="1047">Brand Admin</text>
    <text x="220" y="1222">Operations Manager</text>
    <text x="220" y="1397">Technician</text>
    <text x="220" y="1572">Inventory Staff</text>
    <text x="2180" y="357">Payment Provider</text>
    <text x="2180" y="577">Device / Gateway</text>
  </g>

  <rect class="legend" x="650" y="1617" width="1100" height="45" rx="8"/>
  <path class="include" d="M690 1640 L790 1640" marker-end="url(#arrow)"/>
  <text class="include-label" x="815" y="1646">&lt;&lt;include&gt;&gt; = required included behavior</text>
  <text class="note" x="1240" y="1646">Actor links indicate interaction; confirm detailed permissions against the specification.</text>
</svg>

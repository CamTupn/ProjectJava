    <path d="M300 775 C420 775 500 1040 650 1040"/>
    <path d="M300 775 C700 775 950 1130 1240 1130"/>
    <path d="M300 950 C420 950 500 770 650 770"/>
    <path d="M300 950 C420 950 500 950 650 950"/>
    <path d="M300 950 C420 950 500 1040 650 1040"/>
    <path d="M300 950 C420 950 500 1130 650 1130"/>
    <path d="M300 950 C700 950 950 1130 1240 1130"/>
    <path d="M300 1125 C420 1125 500 770 650 770"/>
    <path d="M300 1125 C420 1125 500 1040 650 1040"/>
    <path d="M300 1125 C700 1125 950 860 1240 860"/>
    <path d="M300 1125 C700 1125 950 950 1240 950"/>
    <path d="M300 1125 C700 1125 950 1040 1240 1040"/>
    <path d="M300 1125 C700 1125 950 1130 1240 1130"/>
    <path d="M300 1300 C420 1300 500 770 650 770"/>
    <path d="M300 1300 C420 1300 500 1040 650 1040"/>
    <path d="M300 1300 C700 1300 950 860 1240 860"/>
    <path d="M300 1300 C700 1300 950 950 1240 950"/>
    <path d="M300 1300 C700 1300 950 1040 1240 1040"/>
    <path d="M300 1475 C420 1475 500 770 650 770"/>
    <path d="M300 1475 C420 1475 500 1040 650 1040"/>
    <path d="M300 1475 C420 1475 500 1130 650 1130"/>
    <path d="M300 1475 C420 1475 500 1220 650 1220"/>
    <path d="M300 1475 C700 1475 950 950 1240 950"/>

    <text class="uc-label" x="840" y="876" text-anchor="middle">Manage Brand</text>
    <ellipse class="usecase" cx="840" cy="950" rx="190" ry="39"/>
    <text class="uc-id" x="840" y="943" text-anchor="middle">UC-10</text>
    <text class="uc-label" x="840" y="966" text-anchor="middle">Manage Products</text>
    <ellipse class="usecase" cx="840" cy="1040" rx="190" ry="39"/>
    <text class="uc-id" x="840" y="1033" text-anchor="middle">UC-11</text>
    <text class="uc-label" x="840" y="1056" text-anchor="middle">Manage Machines and Slots</text>
    <ellipse class="usecase" cx="840" cy="1130" rx="190" ry="39"/>
    <text class="uc-id" x="840" y="1123" text-anchor="middle">UC-12</text>
    <text class="uc-label" x="840" y="1146" text-anchor="middle">Manage Inventory</text>
    <ellipse class="usecase" cx="840" cy="1220" rx="190" ry="39"/>
    <text class="uc-id" x="840" y="1213" text-anchor="middle">UC-13</text>
    <text class="uc-label" x="840" y="1236" text-anchor="middle">Record Refill</text>
    <ellipse class="usecase" cx="1430" cy="860" rx="190" ry="39"/>
    <text class="uc-id" x="1430" y="853" text-anchor="middle">UC-14</text>
    <text class="uc-label" x="1430" y="876" text-anchor="middle">Monitor Device Status</text>
    <ellipse class="usecase" cx="1430" cy="950" rx="190" ry="39"/>
    <text class="uc-id" x="1430" y="943" text-anchor="middle">UC-15</text>
    <text class="uc-label" x="1430" y="966" text-anchor="middle">Manage Alerts</text>
    <ellipse class="usecase" cx="1430" cy="1040" rx="190" ry="39"/>
    <text class="uc-id" x="1430" y="1033" text-anchor="middle">UC-16</text>
    <text class="uc-label" x="1430" y="1056" text-anchor="middle">Manage Maintenance</text>
    <ellipse class="usecase" cx="1430" cy="1130" rx="190" ry="39"/>

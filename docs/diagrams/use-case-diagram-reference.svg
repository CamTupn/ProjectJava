    <text class="uc-label" x="1430" y="536" text-anchor="middle">View Dispensing Result</text>
  </g>

  <!-- Admin use cases -->
  <g>
    <ellipse class="usecase" cx="840" cy="770" rx="190" ry="39"/>
    <text class="uc-id" x="840" y="763" text-anchor="middle">UC-08</text>
    <text class="uc-label" x="840" y="786" text-anchor="middle">Log In</text>
    <ellipse class="usecase" cx="840" cy="860" rx="190" ry="39"/>

    <text class="uc-id" x="840" y="263" text-anchor="middle">UC-01</text>
    <text class="uc-label" x="840" y="286" text-anchor="middle">View Available Fragrances</text>
    <ellipse class="usecase" cx="840" cy="365" rx="190" ry="39"/>
    <text class="uc-id" x="840" y="358" text-anchor="middle">UC-02</text>
    <text class="uc-label" x="840" y="381" text-anchor="middle">Select Fragrance</text>
    <ellipse class="usecase" cx="840" cy="460" rx="190" ry="39"/>
    <text class="uc-id" x="840" y="453" text-anchor="middle">UC-03</text>
    <text class="uc-label" x="840" y="476" text-anchor="middle">Create Experience Order</text>
    <ellipse class="usecase" cx="840" cy="555" rx="190" ry="39"/>
    <text class="uc-id" x="840" y="548" text-anchor="middle">UC-04</text>
    <text class="uc-label" x="840" y="571" text-anchor="middle">Make QR Payment</text>
    <ellipse class="usecase" cx="1430" cy="300" rx="190" ry="39"/>
